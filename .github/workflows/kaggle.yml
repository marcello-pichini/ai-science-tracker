name: Kaggle dataset
on:
  schedule:
    - cron: '43 6 * * *'  # daily, after Daily refresh (04:30 UTC); off-peak minute
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kaggle
jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Enough history for the 25-hour change window without cloning the whole repository.
          fetch-depth: 100
      - name: Upload a new version when the catalog changed
        run: |
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; then
            echo "::warning::KAGGLE_USERNAME/KAGGLE_KEY secrets are not set; skipping."
            exit 0
          fi
          # shortcut: a 25-hour git window detects changes; a skipped day needs a manual dispatch
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && \
             [ -z "$(git log --since='25 hours ago' --format=%H -- data/discoveries.csv data/discoveries.json)" ]; then
            echo "Catalog unchanged; nothing to upload."
            exit 0
          fi
          # New-style API tokens (KGAT_...) are read from KAGGLE_API_TOKEN; legacy keys from KAGGLE_KEY
          case "$KAGGLE_KEY" in KGAT_*) export KAGGLE_API_TOKEN=$KAGGLE_KEY; unset KAGGLE_KEY ;; esac
          pip install --quiet kaggle
          mkdir -p work/kaggle
          cp data/discoveries.csv data/discoveries.json work/kaggle/
          # keywords must be repeated on every version, or Kaggle drops the dataset tags
          echo '{"id": "marcellopichini/ai-science-tracker-ai-enabled-discoveries", "keywords": ["artificial intelligence", "science and technology", "biology", "chemistry", "research"]}' > work/kaggle/dataset-metadata.json
          kaggle datasets version -p work/kaggle -m "Catalog update $(git log -1 --format=%cs) ($(git rev-parse --short HEAD))"
