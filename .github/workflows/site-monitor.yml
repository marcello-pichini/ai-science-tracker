name: Site and dataset checks
on:
  workflow_run:
    workflows: [Publish datasets]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      external_links:
        description: Also check all external source links
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  deployments: read
concurrency:
  group: site-monitor
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Select the deployed snapshot and latest archive release
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_LINKS: ${{ inputs.external_links }}
        run: |
          mkdir -p monitoring-reports
          python3 scripts/deployment_state.py select --output monitoring-reports/deployment.json
          sha=$(python3 -c 'import json; print(json.load(open("monitoring-reports/deployment.json"))["deployed_sha"])')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          release=$(gh release view --json tagName,publishedAt,url,targetCommitish)
          tag=$(jq -r '.tagName' <<< "$release")
          [[ "$tag" =~ ^v[0-9][0-9A-Za-z._-]*$ ]] || { echo "::error::Invalid archive release tag"; exit 1; }
          release_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid archive release commit"; exit 1; }
          jq --arg sha "$release_sha" '. + {targetSha: $sha}' <<< "$release" > monitoring-reports/release.json
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          if [ "$RUN_LINKS" = true ] || { [ "$EVENT_NAME" = schedule ] && [ "$(date -u +%u)" = 1 ]; }; then
            echo "links=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.snapshot.outputs.sha }}
          path: published
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.snapshot.outputs.release_sha }}
          path: archived
          sparse-checkout: api/v1/manifest.json
          sparse-checkout-cone-mode: false
      - name: Check live pages, assets and dataset parity
        run: >-
          python3 scripts/check_publication.py --root published
          --deployment-metadata monitoring-reports/deployment.json
          --release-metadata monitoring-reports/release.json
          --release-manifest archived/api/v1/manifest.json
          --report monitoring-reports/publication.json
      - name: Check external sources weekly or on request
        if: ${{ !cancelled() && steps.snapshot.outputs.links == 'true' }}
        run: python3 scripts/check_links.py --root published --report monitoring-reports/links.json
      - name: Summarize checks
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          print('## Site and dataset monitoring\n')
          for path in sorted(Path('monitoring-reports').glob('*.json')):
              data = json.loads(path.read_text())
              if 'results' in data:
                  for row in data['results']:
                      print(f"- **{row['status']}** `{row['check']}`: {row['detail']}")
              if 'links' in data:
                  print(f"\nExternal sources: {data['total']} checked, {data['gone']} confirmed missing, {data['uncertain']} inconclusive.")
          print('\nFull details are available in the monitoring-reports artifact.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: monitoring-reports
          path: monitoring-reports/
          retention-days: 30
