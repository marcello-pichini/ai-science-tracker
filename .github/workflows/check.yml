name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit to validate and deploy
        required: false
        type: string
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.main.outputs.current }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify requested snapshot
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test -z "$EXPECTED_SHA" || test "$EXPECTED_SHA" = "$GITHUB_SHA"
      - name: Install benchmark YAML reader
        run: python3 -m pip install PyYAML==6.0.3
      - name: Tests
        run: python3 -m unittest discover -s tests
      - name: Generated files are up to date
        run: |
          python3 scripts/generate_share.py
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: MCP worker tests
        working-directory: mcp
        run: npm ci --omit=dev --no-audit --no-fund && npm test
      # A newer main is an expected race: end green and leave deployment to the newer run.
      # Gated at job level so no github-pages deployment record is created for this SHA.
      - name: Skip deployment if main has moved
        id: main
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          main=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$main" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Main moved to $main; this superseded snapshot passed checks but is not deployed."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.check.outputs.current == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Refuse superseded main snapshot
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - name: Package tracked public snapshot
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/site"
          rm -rf "$RUNNER_TEMP/site/.github" "$RUNNER_TEMP/site/tests" "$RUNNER_TEMP/site/scripts"
          mb=$(du -sm "$RUNNER_TEMP/site" | cut -f1)
          echo "Packaged site: ${mb} MB of the 1 GB Pages limit"
          if [ "$mb" -gt 700 ]; then echo "::warning::Packaged site is ${mb} MB, above the 700 MB budget (Pages limit 1 GB)."; fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        id: pages-artifact
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/site
      - name: Wait for this attempt's Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
          PAGES_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
        run: |
          test -n "$PAGES_ARTIFACT_ID"
          visible=false
          for attempt in {1..12}; do
            if ids=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                -f name="$PAGES_ARTIFACT_NAME" --jq '.artifacts[] | select(.expired == false) | .id') &&
                grep -Fxq "$PAGES_ARTIFACT_ID" <<< "$ids"; then
              if [ "$visible" = true ]; then exit 0; fi
              visible=true
            else
              visible=false
            fi
            sleep 5
          done
          echo "::error::Pages artifact $PAGES_ARTIFACT_ID did not become visible"
          exit 1
      - name: Recheck main before deployment
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
