name: IndexNow
on:
  workflow_run:
    # Check deploys Pages since the switch to Actions-based publishing
    workflows: [Check]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Trusted ref only: never check out code named by the triggering run.
          ref: main
          fetch-depth: 200
      # Diff from the previously deployed commit to the one this Check run deployed, so a
      # multi-commit push or a newer main never drops pages. SHAs are only passed to git.
      # A green Check skips its deploy job when main has moved; only deployed runs count.
      - env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          deployed() { [ "$(gh run view "$1" --json jobs -q '[.jobs[] | select(.name == "deploy") | .conclusion][0] // empty')" = success ]; }
          if ! deployed "$RUN_ID"; then
            echo "::notice::Check run $RUN_ID did not deploy $HEAD_SHA; nothing to notify."
            exit 0
          fi
          base=""
          while read -r id sha; do
            if [ "$sha" != "$HEAD_SHA" ] && deployed "$id"; then base="$sha"; break; fi
          done < <(gh run list --workflow Check --branch main --status success --limit 20 --json databaseId,headSha -q '.[] | "\(.databaseId) \(.headSha)"' || true)
          if [ -z "$base" ] || ! git merge-base --is-ancestor "$base" "$HEAD_SHA" 2>/dev/null; then base="$HEAD_SHA~1"; fi
          python3 scripts/indexnow.py "$base" "$HEAD_SHA"
