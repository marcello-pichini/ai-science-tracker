name: IndexNow
on:
  workflow_run:
    # Check deploys Pages since the switch to Actions-based publishing
    workflows: [Check]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      # shortcut: compares only the last commit; a multi-commit push misses earlier ones, use the push range if that matters
      - run: python3 scripts/indexnow.py HEAD~1 HEAD
