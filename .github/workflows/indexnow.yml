name: IndexNow
on:
  workflow_run:
    # Check deploys Pages since the switch to Actions-based publishing
    workflows: [Check]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Trusted ref only: never check out code named by the triggering run.
          ref: main
          fetch-depth: 2
      # shortcut: compares only the last commit; a multi-commit push misses earlier ones, use the push range if that matters
      - run: python3 scripts/indexnow.py HEAD~1 HEAD
