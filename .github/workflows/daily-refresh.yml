name: Daily refresh
on:
  schedule:
    - cron: '30 4 * * *'  # every day 04:30 UTC
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: daily-refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh independent sources and retain failed snapshots
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/deployment_state.py refresh
      - name: Retain per-source benchmark refresh report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-refresh-report
          path: work/*refresh-report.json
          retention-days: 30
      - name: Regenerate pages, API, feed and llms.txt
        env:
          CHROME: /usr/bin/google-chrome
        run: python3 scripts/generate_share.py
      - name: Tests
        run: python3 -m unittest discover -s tests
      - name: Commit and push if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git add -- index.html profile.html models.html search.html security.html model-progress.html methodology.html dataset.html it/ de/ fr/ es/ data/ scripts/public-benchmark-inputs.json share/ profiles/ og/ api/ feed.xml llms.txt sitemap.xml robots.txt
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Daily refresh: model data, licensed benchmarks and generated files"
          git push origin HEAD:main
          gh workflow run check.yml --ref main -f expected_sha="$(git rev-parse HEAD)"
