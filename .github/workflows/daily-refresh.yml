name: Daily refresh
on:
  schedule:
    - cron: '30 4 * * *'  # every day 04:30 UTC
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: daily-refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Refresh independent sources and retain failed snapshots
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/deployment_state.py refresh
      - name: Retain per-source benchmark refresh report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-refresh-report
          path: work/*refresh-report.json
          retention-days: 30
      - name: Regenerate pages, API, feed and llms.txt
        env:
          CHROME: /usr/bin/google-chrome
        run: python3 scripts/generate_share.py
      - name: Tests
        run: python3 -m unittest discover -s tests
      - name: Commit and push if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git add -- index.html insights.html profile.html models.html search.html security.html model-progress.html methodology.html dataset.html it/ de/ fr/ es/ data/ scripts/public-benchmark-inputs.json share/ profiles/ og/ api/ feed.xml llms.txt llms-full.txt .well-known/ sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "Nothing changed."
            if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then exit 0; fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Daily refresh: model data, licensed benchmarks and generated files"
            git push origin HEAD:main
          fi
          sha=$(git rev-parse HEAD)
          # A bot dispatch does not carry the usual workflow_run chain through publication.
          dispatch_and_wait() {
            local workflow="$1" run_id run run_sha status conclusion unavailable=0
            shift
            if [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$sha" ]; then
              echo "Main advanced; leaving publication to the newer commit."
              exit 0
            fi
            run_id=$(gh api --method POST -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/dispatches" \
              -f ref=main "$@" --jq .workflow_run_id)
            [[ "$run_id" =~ ^[0-9]+$ ]]
            echo "Waiting for $workflow: https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id"
            for attempt in {1..120}; do
              if ! run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
                --jq '[.head_sha, .status, .conclusion] | @tsv'); then
                unavailable=$((unavailable + 1))
                if [ "$unavailable" -ge 6 ]; then
                  echo "::error::Could not read status for $workflow run $run_id."
                  return 1
                fi
                sleep 10
                continue
              fi
              unavailable=0
              IFS=$'\t' read -r run_sha status conclusion <<< "$run"
              test "$run_sha" = "$sha"
              if [ "$status" = completed ]; then
                test "$conclusion" = success
                return
              fi
              sleep 10
            done
            echo "::error::$workflow did not finish within 20 minutes."
            return 1
          }
          dispatch_and_wait check.yml -f "inputs[expected_sha]=$sha"
          dispatch_and_wait weekly-release.yml -f "inputs[expected_sha]=$sha"
          dispatch_and_wait site-monitor.yml
