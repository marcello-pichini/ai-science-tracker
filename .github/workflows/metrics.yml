name: Weekly metrics
on:
  schedule:
    - cron: '41 5 * * 2'  # Tuesdays 05:41 UTC, off-peak minute
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Collect metrics
        env:
          # Optional; GitHub traffic needs administration read access, which GITHUB_TOKEN lacks.
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python3 scripts/collect_metrics.py --output metrics/metrics.csv >> "$GITHUB_STEP_SUMMARY"
      # shortcut: one CSV row per run kept 90 days as an artifact, no long-term store yet; append to a tracked or external store when trends matter.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: metrics-${{ github.run_id }}
          path: metrics/metrics.csv
          retention-days: 90
