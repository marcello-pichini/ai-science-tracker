name: Publish datasets
# Keep this workflow path stable; publication now follows successful site deployments.
on:
  workflow_run:
    workflows: [Check, pages-build-deployment, pages build and deployment]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Published commit expected by the calling workflow
        type: string
        required: false
permissions:
  contents: write
  actions: read
  deployments: read
concurrency:
  group: dataset-publication
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event != 'pull_request'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - name: Select verified successful Pages deployment
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.event.workflow_run.head_commit.id || inputs.expected_sha }}
        run: |
          if ! python3 scripts/deployment_state.py select --require-check --require-current --output "$RUNNER_TEMP/deployment.json" 2> "$RUNNER_TEMP/select.err"; then
            cat "$RUNNER_TEMP/select.err" >&2
            # Expected race: main moved past the event commit; the newer commit's run publishes.
            if [ -n "$EVENT_SHA" ] && [ "$EVENT_SHA" != "$(git ls-remote origin refs/heads/main | cut -f1)" ] &&
                grep -q 'Current main has not successfully deployed' "$RUNNER_TEMP/select.err"; then
              echo "::notice::Main moved past $EVENT_SHA before it deployed; skipping publication."
              exit 0
            fi
            exit 1
          fi
          sha=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["deployed_sha"])' "$RUNNER_TEMP/deployment.json")
          if [ -n "$EVENT_SHA" ] && [ "$EVENT_SHA" != "$sha" ]; then echo "Superseded event; skipping."; exit 0; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        id: checkout
        if: steps.snapshot.outputs.sha != ''
        with:
          fetch-depth: 0
          ref: ${{ steps.snapshot.outputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.snapshot.outputs.sha != ''
        with:
          python-version: '3.12'
      - name: Release if data changed
        if: steps.snapshot.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          last=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$last" ] && git diff --quiet "$last" HEAD -- data/; then
            echo "No data changes since $last; skipping."
            exit 0
          fi
          tag="v$(date -u +%Y.%m.%d)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already exists; skipping."
            exit 0
          fi
          notes=()
          if [ -n "$last" ]; then notes+=(--notes-start-tag "$last"); fi
          gh release create "$tag" --target "$(git rev-parse HEAD)" --title "$tag" --generate-notes "${notes[@]}"
      - name: Upload to Hugging Face
        # Needs the HF_TOKEN repository secret (write token for marcello-pichini/ai-science-tracker).
        # Retry independently even if today's release already exists.
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          if [ -z "$HF_TOKEN" ]; then echo "::error::HF_TOKEN is not configured."; exit 1; fi
          pip install -q huggingface_hub
          snapshot_date=$(git log -1 --format=%cs -- data/discoveries.csv data/discoveries.json data/vulnerabilities-overview.json huggingface/README.md)
          python3 scripts/build_hf_dataset.py hf-build --snapshot-date "$snapshot_date"
          python3 -c "from huggingface_hub import upload_folder; upload_folder(repo_id='marcello-pichini/ai-science-tracker', repo_type='dataset', folder_path='hf-build', commit_message='Catalog snapshot $(date -u +%Y-%m-%d)')"
