<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labs and model families · AI Science Tracker</title>
<meta name="description" content="Profiles of the organizations and model families behind the scientific discoveries tracked here: timeline, discoveries and model releases.">
<meta property="og:title" content="Labs and model families · AI Science Tracker">
<meta property="og:description" content="Profiles of the organizations and model families behind the scientific discoveries tracked here.">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2312367e'/%3E%3Cpath d='M8 24v-6M12 24v-11M16 24v-15M20 24v-8M24 24v-4' stroke='%23f2f6ff' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">

<body>
<header class="header">
  <div class="wrap">
    <a class="marchio" href="index.html" aria-label="AI Science Tracker, home page">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#f2f6ff"/><path d="M8 24v-6M12 24v-11M16 24v-15M20 24v-8M24 24v-4" stroke="#12367e" stroke-width="2.6" stroke-linecap="round"/></svg>
      <span>AI Science Tracker</span>
    </a>
    <nav class="menu" aria-label="Site sections"><a href="index.html">Discoveries</a><a href="models.html">Models</a><a href="methodology.html">Methodology</a><a href="guide.html">Guide</a></nav>
  </div>
</header>

<section class="banda" aria-labelledby="page-title">
  <div class="wrap">
    <h1 id="page-title">Labs and model families</h1>
    <p class="lead" id="lead">Loading…</p>
    <figure class="figura" id="timeline-figure" hidden>
      <div id="timeline"></div>
      <figcaption class="nota">Each mark is one discovery; taller means more relevant. Click a mark to jump to it.</figcaption>
    </figure>
  </div>
</section>

<main id="content"></main>

<footer class="footer">
  <div class="wrap">
    <p>Each entry links to the original announcement. Figures are reported by sources and have not been independently verified. Model data: <a href="https://epoch.ai/data/ai-models">Epoch AI</a>, CC BY 4.0.</p>
    <p><a href="methodology.html">How we select and verify entries</a></p>
  </div>
</footer>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//.test(u) ? u : "#";
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const fmt = new Intl.DateTimeFormat("en-GB", { day:"numeric", month:"short", year:"numeric" });
const fmtDate = d => fmt.format(new Date(d + "T12:00:00"));
const reduced = matchMedia("(prefers-reduced-motion: reduce)");

// Same rules as index.html: organizations listed together count under the first one named; relevance is 0-100.
const leadOrg = s => s.organization.split(/,| and /i)[0].trim();
const score = s => Math.round((s.relevance.impact + s.relevance.validation + s.relevance.novelty) / 3 * 20);
const average = a => a.length ? Math.round(a.reduce((n, s) => n + score(s), 0) / a.length) : 0;
const newestFirst = (a, b) => b.publication_date.localeCompare(a.publication_date);
// shortcut: a lab matches model-release organizations by this alias list; add a line when a lab's models are missing.
const MODEL_ORG_ALIASES = { "google deepmind":["google deepmind","deepmind"], "google research":["google"], "microsoft research":["microsoft"], "meta ai":["meta ai"] };
const modelOrgs = lab => MODEL_ORG_ALIASES[lab.toLowerCase()] || [lab.toLowerCase()];

/* One tooltip element; text is inserted with textContent. */
const tip = document.createElement("div"); tip.className = "tip"; tip.setAttribute("aria-hidden", "true"); document.body.append(tip);
function showTip(lines, x, y) {
  tip.replaceChildren();
  lines.forEach((t, i) => { const el = document.createElement(i ? "span" : "b"); el.textContent = t; if (i > 1) tip.append(document.createElement("br")); tip.append(el); });
  tip.classList.add("on");
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let L = x + 16, T = y - h - 16;
  if (L + w > innerWidth - 8) L = Math.max(8, x - w - 16);
  if (T < 8) T = y + 20;
  tip.style.left = L + "px"; tip.style.top = T + "px";
}
const hideTip = () => tip.classList.remove("on");

/* Timeline: one mark per discovery, height = relevance. Same look as the spectrum on the home page. */
function timeline(items) {
  const figure = $("timeline-figure"); figure.hidden = false;
  const W = Math.max(320, Math.round($("timeline").clientWidth || 1000));
  const P = { x0: W < 560 ? 30 : 40, x1: W - 8, base: 196, tall: 168 };
  const years = items.map(s => +s.publication_date.slice(0, 4));
  const y0 = Math.min(...years), y1 = Math.max(...years);
  const t0 = Date.UTC(y0, 0, 1), t1 = Date.UTC(y1 + 1, 0, 1);
  const X = t => P.x0 + (t - t0) / (t1 - t0) * (P.x1 - P.x0);
  let g = [0, 50, 100].map(v => { const y = P.base - v / 100 * P.tall;
    return `<line class="asse" x1="${P.x0}" x2="${P.x1}" y1="${y}" y2="${y}"/><text class="tick y" x="${P.x0 - 10}" y="${y + 4}">${v}</text>`; }).join("");
  const step = Math.max(1, Math.ceil((y1 - y0 + 1) / Math.max(2, Math.floor((P.x1 - P.x0) / 70))));
  for (let a = y0; a <= y1; a += step) { const x = X(Date.UTC(a, 0, 1));
    g += `<line class="asse" x1="${x}" x2="${x}" y1="${P.base}" y2="${P.base + 8}"/><text class="tick" x="${x + 5}" y="${P.base + 24}">${a}</text>`; }
  const marks = items.map((s, i) => { const x = X(Date.parse(s.publication_date)), h = Math.max(4, score(s) / 100 * P.tall);
    return { s, x, tag: `<line class="tratto" data-i="${i}" x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${P.base}" y2="${(P.base - h).toFixed(1)}" style="--d:${Math.round((x - P.x0) / (P.x1 - P.x0) * 900)}ms"/>` }; });
  $("timeline").innerHTML = `<svg viewBox="0 0 ${W} 228" tabindex="0" role="group" aria-label="Timeline of ${plural(items.length, "discovery", "discoveries")}, from ${y0} to ${y1}; height represents relevance from 0 to 100. The full list appears below.">${g}<g>${marks.map(m => m.tag).join("")}</g><rect x="${P.x0 - 6}" y="0" width="${P.x1 - P.x0 + 12}" height="${P.base + 10}" fill="transparent"/></svg>`;
  const svg = $("timeline").firstElementChild;
  const order = marks.map((_, i) => i).sort((a, b) => marks[a].x - marks[b].x);
  let cur = -1;
  const off = () => { svg.querySelector(".tratto.su")?.classList.remove("su"); cur = -1; hideTip(); };
  const on = (i, x, y) => {
    if (cur !== i) { svg.querySelector(".tratto.su")?.classList.remove("su"); svg.querySelector(`[data-i="${i}"]`).classList.add("su"); cur = i; }
    const s = marks[i].s; showTip([s.title, `${fmtDate(s.publication_date)}, ${s.organization}`, `Relevance ${score(s)}, ${s.field}`], x, y);
  };
  const open = () => { const el = cur >= 0 && document.getElementById(marks[cur].s.id); if (el) el.scrollIntoView({ block:"center", behavior: reduced.matches ? "auto" : "smooth" }); };
  svg.addEventListener("pointermove", e => {
    const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
    const v = p.matrixTransform(svg.getScreenCTM().inverse());
    let best = -1, bd = Infinity; marks.forEach((m, i) => { const d = Math.abs(m.x - v.x); if (d < bd) { bd = d; best = i; } });
    if (best >= 0 && bd < 24) on(best, e.clientX, e.clientY); else off();
  });
  svg.addEventListener("pointerleave", off); svg.addEventListener("blur", off); svg.addEventListener("click", open);
  svg.addEventListener("keydown", e => {
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      e.preventDefault();
      const pos = cur < 0 ? (e.key === "ArrowRight" ? -1 : order.length) : order.indexOf(cur);
      const n = Math.min(order.length - 1, Math.max(0, pos + (e.key === "ArrowRight" ? 1 : -1)));
      const r = svg.querySelector(`[data-i="${order[n]}"]`).getBoundingClientRect(); on(order[n], r.left + r.width / 2, r.top);
    } else if (e.key === "Enter" && cur >= 0) { e.preventDefault(); open(); }
    else if (e.key === "Escape") off();
  });
}

/* Shared blocks. Markup and classes match the discovery entries on index.html. */
function entry(s) {
  const p = score(s);
  return `<article class="voce" id="${esc(s.id)}">
    <div class="voce-meta"><time datetime="${esc(s.publication_date)}">${esc(fmtDate(s.publication_date))}</time><span>${esc(s.organization)}</span></div>
    <h3><a href="index.html#discovery=${encodeURIComponent(s.id)}">${esc(s.title)}</a></h3>
    <p class="sommario">${esc(s.summary)}</p>
    ${s.ai_technology ? `<p class="tech"><span>Technology:</span> ${esc(s.ai_technology)}</p>` : ""}
    <div class="voce-footer">
      <span class="punteggio" title="Impact ${s.relevance.impact}/5, validation ${s.relevance.validation}/5, novelty ${s.relevance.novelty}/5">Relevance ${p}<span class="metro" aria-hidden="true"><i style="width:${p}%"></i></span></span>
      <span class="etich">${esc(s.field)}</span>
      <span class="collegamenti"><a href="${esc(safeUrl(s.source_url))}" rel="noopener">Original source</a>${s.paper_url ? `<a href="${esc(safeUrl(s.paper_url))}" rel="noopener">Paper</a>` : ""}</span>
    </div></article>`;
}
const discoveriesSection = items => `<section class="sez" aria-labelledby="t-discoveries"><div class="wrap">
  <h2 id="t-discoveries">${plural(items.length, "discovery", "discoveries")}</h2>
  <p class="sez-sub">Newest first. Each title opens the entry in the full catalog.</p>
  <div class="piatto">${items.map(entry).join("")}</div></div></section>`;
const releasesSection = (models, famName) => !models.length ? "" : `<section class="sez" aria-labelledby="t-releases"><div class="wrap">
  <h2 id="t-releases">${plural(models.length, "model release", "model releases")}</h2>
  <p class="sez-sub">Epoch AI data, newest first. A discovery is attributed to a model family, not to a specific release.</p>
  <table class="tab-rilasci"><thead><tr><th>Date</th><th>Model</th><th>Family</th><th>Access</th></tr></thead><tbody>${models.map(m => `<tr>
    <td data-l="Date"><time datetime="${esc(m.date)}">${esc(fmtDate(m.date))}</time></td>
    <td data-l="Model" class="nome">${m.link ? `<a href="${esc(safeUrl(m.link))}" rel="noopener">${esc(m.name)}</a>` : esc(m.name)}${m.frontier ? `<span class="frontiera">frontier</span>` : ""}</td>
    <td data-l="Family">${m.family && famName[m.family] ? `<a class="badge" href="profile.html?family=${encodeURIComponent(m.family)}">${esc(famName[m.family])}</a>` : ""}</td>
    <td data-l="Access">${esc(m.access || "")}</td></tr>`).join("")}</tbody></table></div></section>`;

/* Views */
function directory(discoveries, models) {
  const byLab = Object.groupBy(discoveries, leadOrg);
  const labs = Object.entries(byLab).sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0], "en"));
  const fams = models.families.filter(f => f.discoveries.length).sort((a, b) => b.discovery_count - a.discovery_count || a.name.localeCompare(b.name, "en"));
  $("lead").innerHTML = `<b>${labs.length} organizations</b> and <b>${fams.length} model families</b> with at least one tracked discovery. Pick one to see its timeline.`;
  $("content").innerHTML = `<section class="sez" aria-labelledby="t-labs"><div class="wrap"><h2 id="t-labs">Organizations</h2>
    <p class="sez-sub">Organizations listed together on a discovery are counted under the first one named.</p>
    <table class="tab-rilasci"><thead><tr><th>Organization</th><th class="num">Discoveries</th><th class="num">Average relevance</th><th class="num">Years</th></tr></thead><tbody>${labs.map(([n, a]) => {
      const y = a.map(s => s.publication_date.slice(0, 4)).sort();
      return `<tr><td data-l="Organization" class="nome"><a href="profile.html?org=${encodeURIComponent(n)}">${esc(n)}</a></td><td data-l="Discoveries" class="num">${a.length}</td><td data-l="Average relevance" class="num">${average(a)}</td><td data-l="Years" class="num">${y[0] === y.at(-1) ? y[0] : y[0] + "–" + y.at(-1)}</td></tr>`; }).join("")}</tbody></table></div></section>
    <section class="sez" aria-labelledby="t-fams"><div class="wrap"><h2 id="t-fams">Model families</h2>
    <p class="sez-sub">Families named as the technology in at least one discovery.</p>
    <table class="tab-rilasci"><thead><tr><th>Family</th><th class="num">Discoveries</th><th class="num">Releases</th></tr></thead><tbody>${fams.map(f => `<tr><td data-l="Family" class="nome"><a href="profile.html?family=${encodeURIComponent(f.id)}">${esc(f.name)}</a></td><td data-l="Discoveries" class="num">${f.discovery_count}</td><td data-l="Releases" class="num">${f.model_count}</td></tr>`).join("")}</tbody></table></div></section>`;
}

function notFound(kind, name) {
  $("page-title").textContent = "Not found";
  $("lead").textContent = `There is no ${kind} named “${name}” in the catalog.`;
  $("content").innerHTML = `<section class="sez"><div class="wrap"><p class="vuoto"><a href="profile.html">Browse all labs and model families</a></p></div></section>`;
}

function setMeta(title, description) {
  document.title = `${title} · AI Science Tracker`;
  document.querySelector('meta[name="description"]').content = description;
  document.querySelector('meta[property="og:title"]').content = document.title;
  document.querySelector('meta[property="og:description"]').content = description;
  document.querySelector('link[rel="canonical"]').href = location.origin + location.pathname + location.search;
}

function labView(name, discoveries, models) {
  const items = discoveries.filter(s => leadOrg(s) === name).sort(newestFirst);
  if (!items.length) return notFound("organization", name);
  const aliases = modelOrgs(name), famName = Object.fromEntries(models.families.map(f => [f.id, f.name]));
  const releases = models.models.filter(m => aliases.includes((m.organization || "").toLowerCase())).sort((a, b) => b.date.localeCompare(a.date));
  const years = items.map(s => s.publication_date.slice(0, 4)).sort();
  $("page-title").textContent = name;
  $("lead").innerHTML = `<b>${plural(items.length, "discovery", "discoveries")}</b> from ${years[0] === years.at(-1) ? years[0] : years[0] + " to " + years.at(-1)}, average relevance <b>${average(items)}</b>. <a href="profile.html">All labs and model families</a>`;
  setMeta(name, `${plural(items.length, "AI-enabled scientific discovery", "AI-enabled scientific discoveries")} tracked from ${name}, with timeline, sources and model releases.`);
  $("content").innerHTML = discoveriesSection(items) + releasesSection(releases, famName);
  timeline(items);
}

function familyView(id, discoveries, models) {
  const fam = models.families.find(f => f.id === id);
  if (!fam) return notFound("model family", id);
  const byId = Object.fromEntries(discoveries.map(s => [s.id, s]));
  const items = fam.discoveries.map(d => byId[d]).filter(Boolean).sort(newestFirst);
  const famName = Object.fromEntries(models.families.map(f => [f.id, f.name]));
  const releases = models.models.filter(m => m.family === id).sort((a, b) => b.date.localeCompare(a.date));
  const labs = [...new Set(items.map(leadOrg))];
  $("page-title").textContent = fam.name;
  $("lead").innerHTML = `<b>${plural(items.length, "discovery", "discoveries")}</b> name this family${items.length ? `, average relevance <b>${average(items)}</b>` : ""}. ${labs.length ? "Announced by " + labs.map(l => `<a href="profile.html?org=${encodeURIComponent(l)}">${esc(l)}</a>`).join(", ") + ". " : ""}Discoveries are attributed to the family, not to a specific release. <a href="profile.html">All labs and model families</a>`;
  setMeta(fam.name, `${plural(items.length, "AI-enabled scientific discovery", "AI-enabled scientific discoveries")} linked to the ${fam.name} model family, with its model releases.`);
  $("content").innerHTML = discoveriesSection(items) + releasesSection(releases, famName);
  if (items.length) timeline(items);
}

let data;
function render() {
  const q = new URLSearchParams(location.search);
  if (q.has("org")) labView(q.get("org"), data.discoveries, data.models);
  else if (q.has("family")) familyView(q.get("family"), data.discoveries, data.models);
  else directory(data.discoveries, data.models);
}

Promise.all([
  fetch("data/discoveries.json", { cache:"no-store" }).then(r => r.json()),
  fetch("data/models.json", { cache:"no-store" }).then(r => r.json())
]).then(([discoveries, models]) => { data = { discoveries, models }; render(); })
  .catch(() => { $("lead").textContent = "Could not load data. Open this page from a local server (python3 -m http.server)."; });

let width = innerWidth, timer;
addEventListener("resize", () => { clearTimeout(timer); timer = setTimeout(() => { if (data && innerWidth !== width) { width = innerWidth; if (!$("timeline-figure").hidden) render(); } }, 150); });
</script>
</body>
</html>
